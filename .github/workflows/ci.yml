name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ts-quality:
    name: ts (biome + tsc + test)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint          # biome check .
      - run: pnpm typecheck     # tsc --noEmit in each package
      - run: pnpm test          # node --test in each package

  rust-quality:
    name: rust (fmt + clippy + test)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain-file: rust-toolchain.toml
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all -- --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test --workspace

  audit:
    name: dependency audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm audit --prod
      - uses: rustsec/audit-check@v2
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

  build-layer:
    name: layer binary (musl)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain-file: rust-toolchain.toml
      - uses: Swatinem/rust-cache@v2
      - name: install musl tools + cmake (aws-lc-sys build)
        run: sudo apt-get update && sudo apt-get install -y musl-tools cmake zip
      - name: build x86_64
        run: cargo build --release --target x86_64-unknown-linux-musl -p zankyo
      - name: build aarch64 via cross (docker)
        run: |
          cargo install cross --locked
          cross build --release --target aarch64-unknown-linux-musl -p zankyo
      - name: package layer zips
        run: bash scripts/build-layer.sh
      - uses: actions/upload-artifact@v4
        with:
          name: zankyo-layer
          path: dist/layer/
