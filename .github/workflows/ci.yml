name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

# PR は新しい push で古い run を取り消す。main の push は run ごとの group にして、
# 取り消しも待機中の run の置き換えも起こさず、どのコミットにも結果を残す
concurrency:
  group: ci-${{ github.event_name == 'pull_request' && github.ref || github.run_id }}
  cancel-in-progress: true

jobs:
  ts-quality:
    name: ts (biome + tsc + test, node ${{ matrix.node }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      # 24 = engines の下限（.nvmrc と同じ）、26 = 次の LTS
      matrix:
        node: [24, 26]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ matrix.node }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint          # biome check .
      # npm の 2 パッケージ・proxy の crate・SAR の版と、SourceCodeUrl のタグ・CHANGELOG の見出し
      - run: pnpm check:versions
      - run: pnpm build         # tsc emit — zankyo-cdk/dist を生成（examples の typecheck/test が依存）
      # CLI のテストは src を型除去で実行する。公開する bin（package.json の bin が指す dist）の
      # import 書き換えやパスの誤りは、ここで実際に起動して確かめる（bin.js は全コマンドを静的 import する）
      - name: smoke-test the cli bin (dist)
        working-directory: cli
        run: node "$(node -p 'require("./package.json").bin.zankyo')" --version
      - run: pnpm typecheck     # tsc --noEmit in each package
      - run: pnpm test          # node --test in each package

  construct-peer-min:
    name: construct (aws-cdk-lib peer minimum)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # construct/package.json の peerDependencies の下限を正とし、devDependencies より
      # 古い宣言値でも型検査とテストが通ることを確かめる（lockfile の書き換えはこのジョブ内だけ）
      - name: install the declared aws-cdk-lib minimum
        working-directory: construct
        run: |
          min=$(node -p 'require("./package.json").peerDependencies["aws-cdk-lib"].replace(/^[\^~]/, "")')
          pnpm add --save-dev "aws-cdk-lib@$min"
      - working-directory: construct
        run: pnpm typecheck && pnpm test

  rust-quality:
    name: rust (fmt + clippy + test)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # channel/components/targets は rust-toolchain.toml から rustup が自動取得する
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
      - run: cargo fmt --all -- --check
      - run: cargo clippy --locked --workspace --all-targets -- -D warnings
      - run: cargo test --locked --workspace

  rust-msrv:
    name: rust (MSRV)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # proxy/Cargo.toml の rust-version を正とし、rust-toolchain.toml より
      # 古い宣言値でもビルドできることを確かめる（RUSTUP_TOOLCHAIN が toml に優先する）
      - name: install the declared rust-version
        run: |
          msrv=$(sed -n 's/^rust-version = "\(.*\)"/\1/p' proxy/Cargo.toml)
          rustup toolchain install "$msrv" --profile minimal
          echo "RUSTUP_TOOLCHAIN=$msrv" >> "$GITHUB_ENV"
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
      - run: cargo check --locked --workspace --all-targets

  audit:
    name: dependency audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm audit --prod
      - uses: rustsec/audit-check@69366f33c96575abad1ee0dba8212993eecbe998 # v2
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

  build-layer:
    name: layer binary (musl)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
      - name: install musl tools + cmake (aws-lc-sys build)
        run: sudo apt-get update && sudo apt-get install -y musl-tools cmake zip
      - name: build x86_64
        run: cargo build --locked --release --target x86_64-unknown-linux-musl -p zankyo
      - name: build aarch64 via cross (docker)
        run: |
          cargo install cross --locked --version 0.2.5
          cross build --locked --release --target aarch64-unknown-linux-musl -p zankyo
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
      - name: package layer zips
        # 直前ステップで両 arch をビルド済みなので梱包だけ行う
        env:
          SKIP_BUILD: '1'
        run: node scripts/build-layer.mts
      - name: check the license files in the layer zips
        run: |
          for z in dist/layer/*.zip; do
            unzip -tq "$z" share/licenses/zankyo/LICENSE share/licenses/zankyo/THIRD_PARTY_LICENSES
          done
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: zankyo-layer
          path: dist/layer/
